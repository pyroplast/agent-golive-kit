name: live run

# Runs the suite against real models.
#   nebius:  secret NEBIUS_API_KEY; variables MODEL_AGENT, MODEL_JUDGE, MODEL_BUYER (Token Factory model ids)
#   bedrock: variables AWS_ROLE_ARN, MODEL_AGENT, MODEL_JUDGE, MODEL_BUYER (Bedrock inference profile ids);
#            optional REPORT_BUCKET to publish and diff against the last published run
on:
  workflow_dispatch:
    inputs:
      provider:
        description: Model provider
        type: choice
        options: [nebius, bedrock]
        default: nebius
      suite:
        description: "questions = 43 single questions; calls = 5 demo calls of 15 turns"
        type: choice
        options: [questions, calls]
        default: questions
      live:
        description: "calls only: stream sentence by sentence, fast model for easy turns, filler line"
        type: boolean
        default: false
      name:
        description: Run name
        required: true
        default: baseline
      limit:
        description: Only the first N scenarios or calls (empty = all)
        required: false
      compare_to:
        description: Name of an earlier run of this workflow to diff against (optional)
        required: false

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-west-1
      MODEL_AGENT: ${{ vars.MODEL_AGENT }}
      MODEL_JUDGE: ${{ vars.MODEL_JUDGE }}
      MODEL_BUYER: ${{ vars.MODEL_BUYER }}
      NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: AWS login (bedrock only)
        if: ${{ inputs.provider == 'bedrock' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Fetch the earlier run to compare against
        if: ${{ inputs.compare_to != '' }}
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: live-run.yml
          name: run-${{ inputs.compare_to }}
          path: work/runs/${{ inputs.compare_to }}
          if_no_artifact_found: warn

      - name: Run the call suite
        if: ${{ inputs.suite == 'calls' }}
        run: |
          ARGS="--provider ${{ inputs.provider }} --name ${{ inputs.name }} --out work/runs --workers 5"
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          if [ "${{ inputs.live }}" = "true" ]; then ARGS="$ARGS --live"; fi
          python -m deploykit calls $ARGS
          python -m deploykit show work/runs/${{ inputs.name }}

      - name: Run the suite
        if: ${{ inputs.suite != 'calls' }}
        run: |
          ARGS="--provider ${{ inputs.provider }} --name ${{ inputs.name }} --out work/runs --workers 4"
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          if [ -n "${{ inputs.compare_to }}" ] && [ -f "work/runs/${{ inputs.compare_to }}/results.jsonl" ]; then
            ARGS="$ARGS --compare-to work/runs/${{ inputs.compare_to }}"
          fi
          python -m deploykit run $ARGS
          python -m deploykit show work/runs/${{ inputs.name }}

      - name: Publish to S3 (bedrock with REPORT_BUCKET only)
        if: ${{ inputs.provider == 'bedrock' && vars.REPORT_BUCKET != '' }}
        run: python -c "from deploykit.publish import publish_run; print(publish_run('work/runs/${{ inputs.name }}', '${{ vars.REPORT_BUCKET }}'))"

      - uses: actions/upload-artifact@v4
        with:
          name: run-${{ inputs.name }}
          path: work/runs/${{ inputs.name }}/
