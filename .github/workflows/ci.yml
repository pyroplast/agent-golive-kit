name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Mock run (plumbing check)
        run: python -m deploykit run --provider mock --name ci-mock
      - uses: actions/upload-artifact@v4
        with:
          name: mock-report
          path: runs/ci-mock/
